<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grow And Feeds Patrons - Command Center</title>
<style>
  :root {
    /* Phase 2 Palette */
    --primary: #0F3D3A; /* Deep Forest */
    --secondary: #F4B13B; /* Golden Hour */
    --tertiary: #E0745E; /* Terracotta */
    --bg: #F2E6D6; /* Warm Sand */
    --card-bg: #FFFFFF;
    --text-main: #223300; /* Dark Green */
    --text-muted: #6B7280;
    --border: #E5E7EB;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

  /* Qwen-style Sidebar */
  .sidebar {
    width: 64px; background: var(--primary); color: #fff;
    display: flex; flex-direction: column; align-items: center; padding: 16px 0;
    transition: width 0.3s ease; overflow: hidden;
  }
  .sidebar.expanded { width: 240px; align-items: flex-start; padding: 16px 20px; }
  .sidebar-header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; width: 100%; }
  .sidebar-header img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .sidebar-header h2 { font-size: 14px; font-weight: 700; white-space: nowrap; opacity: 0; transition: opacity 0.2s; }
  .sidebar.expanded .sidebar-header h2 { opacity: 1; }
  
  .nav-item {
    display: flex; align-items: center; gap: 16px; padding: 12px; width: 100%;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
    margin-bottom: 8px; color: rgba(255,255,255,0.7); transition: all 0.2s;
  }
  .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: #fff; }
  .nav-icon { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
  .nav-text { white-space: nowrap; opacity: 0; transition: opacity 0.2s; }
  .sidebar.expanded .nav-text { opacity: 1; }

  /* Main Content */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .top-bar { background: var(--card-bg); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .top-bar h1 { font-size: 20px; font-weight: 700; color: var(--primary); }
  .top-bar-actions { display: flex; gap: 12px; }
  
  .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #0a2a28; }
  .btn-accent { background: var(--secondary); color: var(--primary); }
  .btn-accent:hover { background: #d99a2a; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }

  .dashboard-scroll { flex: 1; overflow-y: auto; padding: 32px; }
  
  /* Floating Cards */
  .shipments-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
  .shipment-card {
    background: var(--card-bg); border-radius: 16px; padding: 20px;
    box-shadow: 0 10px 25px rgba(15, 61, 58, 0.08); border: 1px solid rgba(15, 61, 58, 0.05);
    display: flex; flex-direction: column; gap: 16px; transition: transform 0.2s;
  }
  .shipment-card:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(15, 61, 58, 0.12); }
  
  /* Status Specific Card Borders/Accents */
  .shipment-card.status-pending { border-top: 4px solid var(--secondary); }
  .shipment-card.status-assigned { border-top: 4px solid var(--primary); }
  .shipment-card.status-collected { border-top: 4px solid #8B5CF6; }
  .shipment-card.status-processed { border-top: 4px solid #10B981; }
  .shipment-card.status-cancelled { border-top: 4px solid var(--tertiary); }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .waste-emoji { font-size: 24px; background: var(--bg); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
  .card-title h4 { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
  .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .status-badge.pending { background: #FEF3C7; color: #92400E; }
  .status-badge.assigned { background: #D1FAE5; color: #065F46; }
  .status-badge.collected { background: #EDE9FE; color: #5B21B6; }
  .status-badge.processed { background: #D1FAE5; color: #065F46; }
  .status-badge.cancelled { background: #FEE2E2; color: #991B1B; }

  .card-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; }
  .detail-item label { display: block; font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
  
  .card-actions { display: flex; gap: 8px; margin-top: auto; }
  .card-actions select { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; }
  
  /* Login Gate */
  #keyGate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .gate-box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
  .gate-box img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 20px; object-fit: cover; }
</style>
</head>
<body>

<div id="keyGate">
  <div class="gate-box">
    <img src="logo.png" alt="Logo">
    <h2 style="color: var(--primary); margin-bottom: 20px;">Grow And Feeds Patrons</h2>
    <input id="keyInput" type="password" placeholder="Access Key" style="width:100%; padding:12px; margin-bottom:16px; border:1px solid var(--border); border-radius:8px;" />
    <button class="btn btn-primary" style="width:100%;" onclick="saveKey()">Enter Command Center</button>
  </div>
</div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header" onclick="document.getElementById('sidebar').classList.toggle('expanded')">
    <img src="logo.png" alt="Logo">
    <h2>Grow And Feeds Patrons</h2>
  </div>
  <div class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span class="nav-text">Dashboard</span></div>
  <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="nav-text">Live Map</span></div>
  <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="nav-text">Workers</span></div>
</aside>

<main class="main-content" id="app" style="display:none;">
  <header class="top-bar">
    <h1>Operations Dashboard</h1>
    <div class="top-bar-actions">
      <button class="btn btn-accent" onclick="generateAIReport()">AI Report</button>
      <button class="btn btn-primary" onclick="load()">Refresh</button>
    </div>
  </header>

  <div class="dashboard-scroll">
    <div id="shipmentsList" class="shipments-list"></div>
  </div>
</main>

<script>
  const API_BASE = '';
  let workers = [];
  const wasteEmojis = { 'processing': '', 'market': '🛒', 'restaurant': '🍽️', 'household': '🏠', 'agriculture': '', 'institutional': '🏫' };

  function getKey() { return localStorage.getItem('gf_key') || ''; }
  function saveKey() { localStorage.setItem('gf_key', document.getElementById('keyInput').value); enterApp(); }
  async function enterApp() { if(await load()) { document.getElementById('keyGate').style.display='none'; document.getElementById('app').style.display='flex'; document.getElementById('sidebar').style.display='flex'; } }
  
  async function apiFetch(path, opts={}) {
    const res = await fetch(API_BASE+path, { ...opts, headers: { 'Content-Type':'application/json', 'x-api-key': getKey() } });
    if(res.status===401) location.reload();
    return res.json();
  }

  async function load() {
    workers = await apiFetch('/api/field-workers').catch(()=>[]);
    const data = await apiFetch('/api/pickup-requests').catch(()=>[]);
    render(data);
    return true;
  }

  function render(data) {
    const container = document.getElementById('shipmentsList');
    container.innerHTML = '';
    data.forEach(r => {
      const card = document.createElement('div');
      card.className = `shipment-card status-${r.status}`;
      const emoji = wasteEmojis[r.waste_type] || '📦';
      
      card.innerHTML = `
        <div class="card-header">
          <div style="display:flex; gap:12px; align-items:center;">
            <div class="waste-emoji">${emoji}</div>
            <div class="card-title">
              <h4>${r.patron_name}</h4>
              <div style="font-size:12px; color:var(--text-muted);">${r.pickup_location}</div>
            </div>
          </div>
          <span class="status-badge ${r.status}">${r.status}</span>
        </div>
        <div class="card-details">
          <div class="detail-item"><label>Waste Stream</label><span>${r.waste_type}</span></div>
          <div class="detail-item"><label>Volume</label><span>${r.estimated_volume_kg} kg</span></div>
          <div class="detail-item"><label>Vehicle</label><span>${r.vehicle_type || 'Pending'}</span></div>
          <div class="detail-item"><label>Driver</label><span>${r.field_workers?.name || 'Unassigned'}</span></div>
        </div>
        <div class="card-actions">
          <select><option>Update Status</option><option value="collected">Collected</option><option value="processed">Processed</option></select>
          <button class="btn btn-primary" style="font-size:12px;">Save</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  async function generateAIReport() { alert('AI Report feature active. Check console for data.'); }
  if(getKey()) enterApp();
</script>
</body>
</html>
